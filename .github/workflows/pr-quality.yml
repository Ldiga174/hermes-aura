name: Hermes Aura - Isolated Validation

# Manual, no public PR execution, no release distribution.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-isolated-validation
  cancel-in-progress: false

jobs:
  verify:
    name: Source, gateway, Flutter and debug Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false

      - name: Offline Android security configuration check
        run: python3 tools/aura_security_check.py

      - name: Synthetic gateway contract tests (loopback only)
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/fake_gateway/requirements.txt
          python3 tools/fake_gateway/fake_gateway.py --host 127.0.0.1 --port 18642 --api-key test-key > /tmp/aura-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          sleep 2
          python3 tools/fake_gateway/test_fake_gateway.py --url http://127.0.0.1:18642

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 pinned
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 pinned
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: false

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter static analysis
        run: flutter analyze --no-pub --fatal-infos

      - name: Flutter unit and widget tests
        run: flutter test --no-pub

      - name: Build debug Android APK for validation only
        run: flutter build apk --debug --split-per-abi

      - name: Verify locally produced validation APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build/app/outputs/flutter-apk/*debug*.apk
          find build/app/outputs/flutter-apk -name '*debug*.apk' -type f -print0 | xargs -0 sha256sum
          echo 'Debug APK is intentionally not uploaded or released pending license and security review.'
